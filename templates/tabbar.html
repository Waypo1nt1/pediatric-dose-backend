{{ define "tabbar" }}
<nav class="tabbar">
    <a class="tab{{ if eq .ActiveTab "feed" }} tab-active{{ end }}" href="/drug-feed/">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <path d="M10 9.5l5 2.5-5 2.5z"></path>
        </svg>
        <span class="tab-label">Лента</span>
    </a>
    <a class="tab{{ if eq .ActiveTab "draft" }} tab-active{{ end }}" href="/drug-draft">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="3"></rect>
            <path d="M12 8.5v7M8.5 12h7"></path>
        </svg>
        <span class="tab-label">Добавление</span>
    </a>
    <a class="tab{{ if eq .ActiveTab "catalog" }} tab-active{{ end }}" href="/drugs">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect>
            <rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect>
            <rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect>
            <rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect>
        </svg>
        <span class="tab-label">Каталог</span>
    </a>
</nav>
{{ end }}
